<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Найди себя</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior: none;
        }

        #background-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('clean.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
        }

        #scratch-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            cursor: pointer;
        }

        #video-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 3;
            display: none;
            background: #000;
        }

        #secret-btn {
            position: absolute;
            top: 20px; left: 20px;
            width: 60px; height: 60px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            opacity: 0.3;
            z-index: 10;
            cursor: pointer;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        #secret-btn:active { opacity: 0.5; }
    </style>
</head>
<body>

    <div id="background-layer"></div>
    <canvas id="scratch-canvas"></canvas>
    <video id="video-layer" muted playsinline preload="auto" src="driving.mp4"></video>
    <button id="secret-btn" aria-label="Запустить видео"></button>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('scratch-canvas');
            const ctx = canvas.getContext('2d');
            const video = document.getElementById('video-layer');
            const secretBtn = document.getElementById('secret-btn');

            let isDrawing = false;
            let lastX = 0, lastY = 0;
            let videoLaunched = false;
            let launchTriggered = false; // Чтобы не запускать дважды
            const LAUNCH_THRESHOLD = 0.70;

            const dirtyImg = new Image();
            dirtyImg.src = 'dirty.png';
            dirtyImg.onload = initCanvas;

            function drawImageCover(context, img, w, h) {
                const imgRatio = img.width / img.height;
                const canvasRatio = w / h;
                let dw, dh, ox, oy;
                if (imgRatio > canvasRatio) {
                    dh = h; dw = h * imgRatio;
                    ox = (w - dw) / 2; oy = 0;
                } else {
                    dw = w; dh = w / imgRatio;
                    ox = 0; oy = (h - dh) / 2;
                }
                context.drawImage(img, ox, oy, dw, dh);
            }

            function initCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                ctx.globalCompositeOperation = 'source-over';
                drawImageCover(ctx, dirtyImg, canvas.width, canvas.height);
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 100;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }

            window.addEventListener('resize', () => {
                if (videoLaunched) return;
                try {
                    const tempImg = new Image();
                    tempImg.src = canvas.toDataURL();
                    tempImg.onload = () => {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                        ctx.globalCompositeOperation = 'source-over';
                        drawImageCover(ctx, dirtyImg, canvas.width, canvas.height);
                        ctx.drawImage(tempImg, 0, 0, canvas.width, canvas.height);
                        ctx.globalCompositeOperation = 'destination-out';
                    };
                } catch (e) { initCanvas(); }
            });

            function getScratchPercent() {
                const STEP = 15;
                const w = canvas.width, h = canvas.height;
                try {
                    const data = ctx.getImageData(0, 0, w, h).data;
                    let scratched = 0, total = 0;
                    for (let y = 0; y < h; y += STEP) {
                        for (let x = 0; x < w; x += STEP) {
                            if (data[(y * w + x) * 4 + 3] < 100) scratched++;
                            total++;
                        }
                    }
                    return total ? scratched / total : 0;
                } catch (e) { return 0; }
            }

            function launchVideo() {
                if (launchTriggered) return;
                launchTriggered = true;

                // Начинаем загрузку видео заранее
                video.load();

                // Ждём готовности видео
                video.oncanplaythrough = () => {
                    if (videoLaunched) return;
                    videoLaunched = true;
                    
                    // Скрываем canvas и кнопку
                    canvas.style.display = 'none';
                    secretBtn.style.display = 'none';
                    
                    // Показываем и запускаем видео
                    video.style.display = 'block';
                    
                    const playPromise = video.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(error => {
                            console.error('Автозапуск не сработал:', error);
                            // Если не сработал автозапуск (file:// режим)
                            // показываем видео с controls
                            video.controls = true;
                        });
                    }
                };

                video.onerror = () => {
                    console.error('Ошибка загрузки видео');
                };
            }

            function checkAndLaunch() {
                if (videoLaunched || launchTriggered) return;
                if (getScratchPercent() >= LAUNCH_THRESHOLD) {
                    launchVideo();
                }
            }

            // Секретная кнопка тоже запускает видео
            secretBtn.addEventListener('click', () => {
                launchVideo();
            });

            function getCoords(e) {
                if (e.touches && e.touches.length) {
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                }
                return { x: e.clientX, y: e.clientY };
            }

            function startDrawing(e) {
                if (videoLaunched || launchTriggered) return;
                e.preventDefault();
                isDrawing = true;
                const c = getCoords(e);
                lastX = c.x; lastY = c.y;
                ctx.beginPath();
                ctx.arc(lastX, lastY, 50, 0, Math.PI * 2);
                ctx.fill();
            }

            function draw(e) {
                if (!isDrawing || videoLaunched || launchTriggered) return;
                e.preventDefault();
                const c = getCoords(e);
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(c.x, c.y);
                ctx.stroke();
                lastX = c.x; lastY = c.y;
            }

            function stopDrawing() {
                if (!isDrawing) return;
                isDrawing = false;
                checkAndLaunch();
            }

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
            canvas.addEventListener('touchcancel', stopDrawing);
        });
    </script>
</body>
</html>
